# Cổng vào duy nhất: /api → backend Fastify, còn lại → Next.js
upstream api { server api:4000; }
upstream web { server web:3000; }

server {
  listen 80;
  server_name _;

  # Upload video/ảnh dung lượng lớn: stream thẳng tới API, không đệm.
  client_max_body_size 2g;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;          # SSE (AI tạo đề)
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # Ảnh/tệp công khai đã chuyển WebP — cache lâu
  location /api/files/ {
    proxy_pass http://api;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    proxy_pass http://web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
